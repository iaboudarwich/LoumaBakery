# Louma Bakery — build + security headers (committed, in-repo source of truth).

[build]
  command = "npm run build"
  publish = "dist"

# ----------------------------------------------------------------------------
# Security headers for the whole site.
# CSP whitelists exactly what the site uses: self, inline styles/scripts that
# Astro emits, and self-hosted fonts. No third-party frames (the map embed is gone).
# frame-ancestors/X-Frame-Options block clickjacking.
# ----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src 'none'; connect-src 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ----------------------------------------------------------------------------
# Fingerprinted build assets (/_astro/*: hashed JS, CSS, fonts, images) never
# change under the same URL, so browsers may cache them for a year.
# ----------------------------------------------------------------------------
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ----------------------------------------------------------------------------
# /admin (Decap CMS, self-hosted bundle — no CDN anywhere). unsafe-inline/eval
# stay scoped to the editor only; DecapBridge auth/gateway + GitHub content are
# the only remote endpoints. Never indexed.
# ----------------------------------------------------------------------------
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src https://*.decapbridge.com; connect-src 'self' https://auth.decapbridge.com https://gateway.decapbridge.com https://gateways.decapbridge.com https://api.github.com https://raw.githubusercontent.com; worker-src 'self' blob:"
    X-Robots-Tag = "noindex, nofollow"

# /admin-demo: same editor, in-memory test backend (no auth, no remote writes).
[[headers]]
  for = "/admin-demo/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:"
    X-Robots-Tag = "noindex, nofollow"

# ----------------------------------------------------------------------------
# /mission became /initiative (The Louma Initiative). force = true because the
# static build also writes a meta-refresh page at /mission/ (from the Astro
# redirect, for dev), and Netlify would otherwise serve that file instead.
# ----------------------------------------------------------------------------
[[redirects]]
  from = "/mission"
  to = "/initiative"
  status = 301
  force = true

# ----------------------------------------------------------------------------
# Hidden for now (src/config/features.ts: cateringPage, careersPage). While a
# page is switched off its address goes home. When a page is switched back on,
# delete its block here too, or Netlify keeps sending visitors home.
# ----------------------------------------------------------------------------
[[redirects]]
  from = "/catering"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/careers"
  to = "/"
  status = 301
  force = true
