# =============================================================================
#  Louma Bakery: content editor (Decap CMS)
#  Editors log in with email + password (no GitHub account) via DecapBridge.
#  Everything saved here is committed to the repo and goes live on the next
#  Netlify build (usually a minute or two).
# =============================================================================

# -----------------------------------------------------------------------------
#  >>> REPLACE THIS ENTIRE `backend:` BLOCK with the one DecapBridge generates
#      for your site (DecapBridge dashboard → your site → "config.yml").
#      Only two values change: the DecapBridge SITE ID (in identity_url) and,
#      if different, the gateway_url. Keep `branch: main`.
# -----------------------------------------------------------------------------
backend:
  name: git-gateway
  repo: issamlife21-hue/LoumaBakery        # owner/repo, already correct
  branch: main
  identity_url: https://auth.decapbridge.com/sites/PLACEHOLDER_DECAPBRIDGE_SITE_ID
  gateway_url: https://gateways.decapbridge.com
  commit_messages:
    create: 'Edit: add {{collection}} "{{slug}}"'
    update: 'Edit: update {{collection}} "{{slug}}"'
    delete: 'Edit: remove {{collection}} "{{slug}}"'
    uploadMedia: 'Edit: upload photo {{path}}'
    deleteMedia: 'Edit: remove photo {{path}}'

# Branding shown on the DecapBridge login screen / CMS.
site_url: https://loumabakeryy.netlify.app
display_url: https://loumabakeryy.netlify.app
logo_url: https://loumabakeryy.netlify.app/favicon.svg

# Save & publish immediately (no draft/review step): simplest for one manager.
publish_mode: simple

# Uploaded photos are committed here, where the site optimizes them at build.
media_folder: "src/assets/img"
public_folder: "/src/assets/img"

collections:
  # =========================================================== MENU =========
  - name: menu
    label: "Menu"
    description: "Your menu, by category. Each item has a name and an optional short note. Prices aren't shown on the site."
    delete: false
    editor: { preview: false }
    files:
      - name: menu
        label: "Menu items"
        file: "src/data/menu.json"
        description: "Add, edit, reorder, or remove menu items."
        fields:
          - name: categories
            label: "Categories"
            label_singular: "Category"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: id, label: "Internal ID", widget: string, hint: "A short code the site uses for the link to this category. Leave it as it is; for a new category, one plain word, e.g. soups." }
              - { name: title, label: "Category name", widget: string, hint: "e.g. Pastries, Coffee, Add-ons" }
              - { name: order, label: "Show order", widget: number, value_type: int, default: 1, hint: "1 shows first, then 2, 3 and so on." }
              - name: column
                label: "Column"
                widget: select
                default: "food"
                options:
                  - { label: "Food", value: "food" }
                  - { label: "Drinks", value: "drinks" }
                hint: "On computers the menu has two columns: food on the left, drinks on the right. Pick where this category goes. On phones everything is one list, food first."
              - name: items
                label: "Items"
                label_singular: "Item"
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: "Name", widget: string, required: true, hint: "e.g. Croissant" }
                  - { name: note, label: "Note", widget: string, required: false, hint: "Optional. One short line shown under the name in smaller text, e.g. Gluten free. Leave empty for none." }
              - name: notes
                label: "Category notes"
                label_singular: "Note"
                widget: list
                required: false
                field: { name: note, label: "Note", widget: string }
                hint: "Optional. Short lines shown after the items, e.g. Decaf available for any drink."

  # ========================================================= IMAGES =========
  - name: images
    label: "Photos"
    description: "The main photos around the site. Click one to upload a replacement, and describe what's in it."
    delete: false
    editor: { preview: false }
    files:
      - name: photos
        label: "Site photos"
        file: "src/data/images.json"
        fields:
          - { name: hero, label: "Home: top photo", widget: image, choose_url: false, hint: "The photo at the top of the home page, edge to edge, with the tagline in butter over its middle. It shows wide (9:5) on computers and tall (2:3) on phones, cropped around the centre, so pick a photo with no single subject at the edges and a mid-to-dark middle the tagline can sit on. At least 3000px wide, under 3MB." }
          - { name: heroAlt, label: "Top photo description", widget: string, hint: "What the photo shows, for screen readers. e.g. Rows of croissants on a cooling rack" }
          - name: homeKitchen
            label: "Home: kitchen photo"
            widget: object
            summary: "{{fields.alt}}"
            hint: "The wide photo after the intro on the home page, edge to edge: about 2:1 on computers, 4:3 on phones. Landscape, at least 3200px wide, under 3MB."
            fields:
              - { name: image, label: "Photo", widget: image, choose_url: false }
              - { name: alt, label: "Photo description", widget: string, hint: "What the photo shows, for screen readers." }
              - &focus
                name: focus
                label: "Crop focus"
                widget: select
                required: false
                default: "center"
                hint: "Which part of the photo to keep when it is cropped. Centre suits most photos."
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top", value: "top" }
                  - { label: "Upper middle", value: "50% 30%" }
                  - { label: "Just above centre", value: "50% 45%" }
                  - { label: "Just below centre", value: "50% 60%" }
                  - { label: "Lower middle", value: "50% 70%" }
                  - { label: "Bottom", value: "bottom" }
                  - { label: "Left", value: "left" }
                  - { label: "Right", value: "right" }
          - name: menu
            label: "Menu: photo"
            widget: object
            summary: "{{fields.alt}}"
            hint: "The photo in the left half of the band at the top of the Menu page: nearly square on computers, a wide strip on phones. Portrait works best, at least 1600px wide, under 3MB."
            fields:
              - { name: image, label: "Photo", widget: image, choose_url: false }
              - { name: alt, label: "Photo description", widget: string, hint: "What the photo shows, for screen readers." }
              - *focus
          - name: story
            label: "Our Story: photos"
            label_singular: "Photo"
            widget: list
            max: 1
            summary: "{{fields.alt}}"
            hint: "One photo for the Our Story page, shown after the first section. Portrait works best, at least 1200px wide, under 3MB."
            fields:
              - { name: image, label: "Photo", widget: image, choose_url: false }
              - { name: alt, label: "Photo description", widget: string, hint: "What the photo shows, for screen readers." }
              - *focus

  # ================================================== SITE SETTINGS =========
  - name: settings
    label: "Site settings"
    description: "Hours, address, the parking note, the two email addresses, and your Instagram / TikTok / Uber Eats links."
    delete: false
    editor: { preview: false }
    files:
      - name: settings
        label: "Settings"
        file: "src/data/settings.json"
        fields:
          - { name: email, label: "Email address", widget: string, required: true, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', "Type a full email address"], hint: "Where customers reach you. Shown in the footer and on Contact." }
          - { name: ordersEmail, label: "Email for larger orders", widget: string, required: true, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', "Type a full email address"], hint: "Shown as \"for larger orders\" in the footer and on Contact." }
          - name: address
            label: "Address"
            widget: object
            fields:
              - { name: street, label: "Street", widget: string }
              - { name: city, label: "City", widget: string }
              - { name: state, label: "State", widget: string }
              - { name: zip, label: "ZIP code", widget: string }
          - name: hours
            label: "Opening hours"
            widget: list
            summary: "{{fields.days}}: {{fields.open}}{{fields.close}}"
            hint: "One row per group of days. For a closed day, put “Closed” in Opens and leave Closes empty."
            fields:
              - { name: days, label: "Days", widget: string, hint: "e.g. Tuesday – Sunday, or a single day like Monday" }
              - { name: open, label: "Opens", widget: string, hint: "e.g. 7:00 AM  (or “Closed”)" }
              - { name: close, label: "Closes", widget: string, required: false, hint: "e.g. 2:30 PM  (leave empty if closed)" }
          - { name: parkingNote, label: "Parking note", widget: string, required: false, hint: "Shown on the Contact page under the hours. Leave empty to hide." }
          - name: links
            label: "Links"
            widget: object
            fields:
              - { name: instagram, label: "Instagram link", widget: string, hint: "Paste your Instagram profile link here." }
              - { name: instagramHandle, label: "Instagram handle", widget: string, hint: "e.g. @loumabakery. The Contact page shows it as “@loumabakery on Instagram”." }
              - { name: tiktok, label: "TikTok link", widget: string, required: false, hint: "Paste your TikTok profile link here. Leave empty to hide TikTok everywhere." }
              - { name: tiktokHandle, label: "TikTok handle", widget: string, required: false, hint: "e.g. @loumabakery. The Contact page shows it as “@loumabakery on TikTok”." }
              - { name: uberEats, label: "Uber Eats order link", widget: string, hint: "Saved for later. It isn't shown anywhere on the site right now." }


  # ====================================================== PAGE TEXT =========
  - name: copy
    label: "Page text"
    description: "The words on each page. Tip: edit the wording, but leave any “internal” fields as they are."
    delete: false
    editor: { preview: false }
    files:
      - name: copy
        label: "All pages"
        file: "src/data/copy.json"
        fields:
          # ---- Home ----
          - name: home
            label: "Home page"
            widget: object
            collapsed: true
            fields:
              - { name: tagline, label: "Tagline", widget: string, hint: "The big line beside the top photo." }
              - { name: body, label: "Paragraphs", widget: list, field: { name: text, label: "Paragraph", widget: text }, hint: "The two introduction paragraphs further down the page." }
              - { name: instagramTitle, label: "Instagram heading", widget: string, hint: "Above the row of Instagram photos, e.g. Follow along" }
              - { name: newsletterTitle, label: "Newsletter title (hidden on site for now)", widget: string, hint: "The footer signup heading. The signup is switched off for now (see docs/EDITING.md)." }
              - { name: newsletterBody, label: "Newsletter line (hidden on site for now)", widget: string }
          # ---- Story page ----
          - name: story
            label: "Our Story page"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Headline", widget: string, hint: "The letter and sections are under “Our Story” in the left menu." }
          # ---- Initiative page ----
          - name: initiative
            label: "The Louma Initiative page"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Headline", widget: string }
              - { name: intro, label: "Introduction", widget: list, field: { name: text, label: "Paragraph", widget: text }, hint: "The opening paragraphs." }
              - name: sections
                label: "Sections"
                label_singular: "Section"
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: "Section title", widget: string }
                  - { name: paragraphs, label: "Paragraphs", widget: list, field: { name: text, label: "Paragraph", widget: text } }
          # ---- Menu page ----
          - name: menu
            label: "Menu page"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Headline", widget: string }
              - { name: intro, label: "Introduction", widget: list, field: { name: text, label: "Paragraph", widget: text }, hint: "The paragraphs above the menu." }
              - { name: allergenNote, label: "Allergen note", widget: text }
          # ---- Shop page ----
          - name: shop
            label: "Shop page"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Headline", widget: string }
              - { name: status, label: "“Not open yet” text", widget: string, hint: "Shown under any product that has no link yet, e.g. Coming soon. The products are under “Shop” in the left menu." }
              - { name: cart, label: "Button text", widget: string, hint: "The button under a product that has a link, e.g. Add to Cart. It opens the product's link in a new tab." }
          # ---- Visit page ----
          - name: visit
            label: "Contact page"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Headline", widget: string, hint: "Hours, address and emails are under “Site settings”." }
          # ---- Catering page ----
          - name: catering
            label: "Catering page (hidden on site for now)"
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: "Eyebrow", widget: string }
              - { name: title, label: "Headline", widget: string }
              - { name: lede, label: "Intro line", widget: text }
              - { name: body, label: "Paragraphs", widget: list, field: { name: text, label: "Paragraph", widget: text } }
              - name: steps
                label: "Process steps"
                widget: list
                summary: "{{fields.n}} {{fields.title}}"
                fields:
                  - { name: n, label: "Number label", widget: string, hint: "e.g. 01" }
                  - { name: title, label: "Step title", widget: string }
                  - { name: body, label: "Step text", widget: text }
              - name: tiers
                label: "Options / tiers"
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: "Name", widget: string }
                  - { name: price, label: "Price", widget: string, hint: "Kept on file. Not shown on the site: the only price shown anywhere is in the Shop." }
                  - { name: items, label: "Bullet points", widget: list, hint: "Type one and press Enter." }
                  - { name: note, label: "Small badge", widget: string, required: false }
          # ---- Careers page ----
          - name: careers
            label: "Careers page (hidden on site for now)"
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: "Eyebrow", widget: string }
              - { name: title, label: "Headline", widget: string }
              - { name: lede, label: "Intro line", widget: text }
              - { name: body, label: "Paragraphs", widget: list, field: { name: text, label: "Paragraph", widget: text } }
              - name: roles
                label: "Open roles"
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: "Role title", widget: string }
                  - { name: type, label: "Type", widget: string, required: false, hint: "e.g. Full-time" }
                  - { name: body, label: "Description", widget: text }
          # ---- 404 page ----
          - name: notFound
            label: "“Page not found” page"
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: "Eyebrow", widget: string }
              - { name: title, label: "Headline", widget: string }
              - { name: lede, label: "Intro line", widget: text }
              - name: cta
                label: "Button"
                widget: object
                fields:
                  - { name: label, label: "Button text", widget: string }
                  - { name: href, label: "Link", widget: string }

  # ====================================================== OUR STORY =========
  - name: story
    label: "Our Story"
    description: "The letter and the sections on the Our Story page."
    delete: false
    editor: { preview: false }
    files:
      - name: story
        label: "Our Story"
        file: "src/data/story.json"
        fields:
          - name: letter
            label: "The letter"
            widget: object
            fields:
              - { name: paragraphs, label: "Paragraphs", widget: list, field: { name: text, label: "Paragraph", widget: text } }
              - { name: signature, label: "Signed", widget: string, hint: "The name at the end of the letter, e.g. Milla" }
          - name: sections
            label: "Sections"
            label_singular: "Section"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: "Section title", widget: string }
              - { name: paragraphs, label: "Paragraphs", widget: list, field: { name: text, label: "Paragraph", widget: text } }

  # =========================================================== SHOP =========
  - name: shop
    label: "Shop"
    description: "The Shop page: the line at the top and the products, in the order shown."
    delete: false
    editor: { preview: false }
    files:
      - name: shop
        label: "Shop"
        file: "src/data/shop.json"
        fields:
          - { name: intro, label: "Intro line", widget: text, required: false, hint: "The line under the Shop title, e.g. about pre-orders and notice." }
          - name: products
            label: "Products"
            label_singular: "Product"
            widget: list
            summary: "{{fields.name}}"
            hint: "Shown in this order; drag to reorder."
            fields:
              - { name: name, label: "Name", widget: string, hint: "e.g. Louma Hat" }
              - { name: price, label: "Price", widget: string, required: false, hint: "e.g. $32. Leave price empty to hide it." }
              - { name: note, label: "Note", widget: string, required: false, hint: "One short line under the name, e.g. Gluten free. Pre-order, 48 hours notice" }
              - { name: image, label: "Photo", widget: image, required: false, choose_url: false, hint: "Shown square. At least 800px wide, under 3MB. A gift card needs no photo." }
              - { name: alt, label: "Photo description", widget: string, required: false, hint: "What the photo shows, for screen readers." }
              - { name: link, label: "Link", widget: string, required: false, hint: "Your Square (or other shop) page for this product. Leave link empty to show Coming soon." }
              - name: fit
                label: "Photo fit"
                widget: select
                required: false
                default: "cover"
                options:
                  - { label: "Fill the square (photos)", value: "cover" }
                  - { label: "Whole object on the page colour (cutouts)", value: "contain" }
                hint: "Fill suits photos; whole object suits a cutout on a transparent background, like the hat."
              - name: kind
                label: "Type"
                widget: select
                required: false
                default: "product"
                options:
                  - { label: "Product", value: "product" }
                  - { label: "Gift card", value: "giftcard" }
                hint: "Gift card shows a dark red square with the Louma wordmark instead of a photo."

  # ================================================ INSTAGRAM STRIP =========
  - name: instagram
    label: "Instagram strip"
    description: "The row of photos on the home page. Each one links to your Instagram."
    delete: false
    editor: { preview: false }
    files:
      - name: instagram
        label: "Instagram strip"
        file: "src/data/instagram.json"
        fields:
          - name: items
            label: "Photos"
            label_singular: "Photo"
            widget: list
            max: 6
            summary: "{{fields.alt}}"
            hint: "Up to six. A tile with no photo is skipped."
            fields:
              - { name: image, label: "Photo", widget: image, required: false, choose_url: false, hint: "Square works best. At least 600px wide, under 3MB." }
              - { name: alt, label: "Photo description", widget: string, required: false, hint: "What the photo shows, for screen readers." }
