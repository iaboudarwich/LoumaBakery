# =============================================================================
#  Louma Bakery: content editor (Decap CMS)
#  Editors log in with email + password (no GitHub account) via DecapBridge.
#  Everything saved here is committed to the repo and goes live on the next
#  Netlify build (usually a minute or two).
# =============================================================================

# -----------------------------------------------------------------------------
#  >>> REPLACE THIS ENTIRE `backend:` BLOCK with the one DecapBridge generates
#      for your site (DecapBridge dashboard → your site → "config.yml").
#      Only two values change: the DecapBridge SITE ID (in identity_url) and,
#      if different, the gateway_url. Keep `branch: main`.
# -----------------------------------------------------------------------------
backend:
  name: git-gateway
  repo: issamlife21-hue/LoumaBakery        # owner/repo, already correct
  branch: main
  identity_url: https://auth.decapbridge.com/sites/PLACEHOLDER_DECAPBRIDGE_SITE_ID
  gateway_url: https://gateways.decapbridge.com
  commit_messages:
    create: 'Edit: add {{collection}} "{{slug}}"'
    update: 'Edit: update {{collection}} "{{slug}}"'
    delete: 'Edit: remove {{collection}} "{{slug}}"'
    uploadMedia: 'Edit: upload photo {{path}}'
    deleteMedia: 'Edit: remove photo {{path}}'

# Branding shown on the DecapBridge login screen / CMS.
site_url: https://loumabakeryy.netlify.app
display_url: https://loumabakeryy.netlify.app
logo_url: https://loumabakeryy.netlify.app/favicon.svg

# Save & publish immediately (no draft/review step): simplest for one manager.
publish_mode: simple

# Uploaded photos are committed here, where the site optimizes them at build.
media_folder: "src/assets/img"
public_folder: "/src/assets/img"

collections:
  # =========================================================== MENU =========
  - name: menu
    label: "Menu"
    description: "Your menu, by category. Each item has a name, a description, and dietary tags. Prices aren't shown on the site."
    delete: false
    editor: { preview: false }
    files:
      - name: menu
        label: "Menu items"
        file: "src/data/menu.json"
        description: "Add, edit, reorder, or remove menu items."
        fields:
          - name: categories
            label: "Categories"
            label_singular: "Category"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: id, label: "Internal ID", widget: string, hint: "A short code the site uses. Leave it as it is." }
              - { name: title, label: "Category name", widget: string, hint: "e.g. Viennoiserie, Bread, Coffee" }
              - { name: order, label: "Show order", widget: number, value_type: int, default: 1, hint: "1 shows first, then 2, 3…" }
              - name: items
                label: "Items"
                label_singular: "Item"
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: "Name", widget: string, required: true, hint: "e.g. Butter Croissant" }
                  - { name: description, label: "Description", widget: text, required: false, hint: "One short line about the item." }
                  - { name: tags, label: "Dietary tags", widget: select, multiple: true, required: false, options: ["vegan", "vegetarian", "gf", "nut-free"], hint: "Pick any that apply." }
                  - { name: image, label: "Photo", widget: image, required: false, choose_url: false, hint: "Kept on file. Photos aren't shown on the Menu page right now. At least 1200px wide, under 3MB." }
                  - { name: alt, label: "Photo description", widget: string, required: false, hint: "What the photo shows, for screen readers. e.g. Croissants cooling on a sheet tray" }
          - name: addOns
            label: "Add-ons"
            widget: object
            fields:
              - { name: title, label: "Heading", widget: string }
              - { name: afterCategory, label: "Show after category", widget: string, hint: "The Internal ID of the category this list follows, e.g. fridge" }
              - name: items
                label: "Add-ons"
                label_singular: "Add-on"
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: "Name", widget: string, hint: "e.g. Oat milk" }

  # ========================================================= IMAGES =========
  - name: images
    label: "Images"
    description: "The main photos used around the site. Click one to upload a replacement."
    delete: false
    editor: { preview: false }
    files:
      - name: photos
        label: "Site photos"
        file: "src/data/images.json"
        fields:
          - { name: hero, label: "Home: hero photo", widget: image, choose_url: false, hint: "The big photo at the top of the home page. Landscape, at least 1600px wide, under 3MB." }
          - { name: founder, label: "Story: founder portrait", widget: image, required: false, choose_url: false, hint: "Portrait photo on the Our Story page. At least 1200px tall, under 3MB." }
          - { name: story1, label: "Story: photo 1", widget: image, choose_url: false, hint: "First story photo (also the big “01” block on the home page)." }
          - { name: story1Alt, label: "Photo 1 description", widget: string, required: false, hint: "What photo 1 shows, for screen readers." }
          - { name: story2, label: "Story: photo 2", widget: image, choose_url: false }
          - { name: story2Alt, label: "Photo 2 description", widget: string, required: false, hint: "What the photo shows, for screen readers." }
          - { name: ig1, label: "Home: accent photo", widget: image, choose_url: false, hint: "The small inset photo in the home story block." }
          - { name: ig1Alt, label: "Accent photo description", widget: string, required: false, hint: "What the photo shows, for screen readers." }

  # ================================================== SITE SETTINGS =========
  - name: settings
    label: "Site settings"
    description: "Hours, address, the two email addresses, and your Instagram / Uber Eats links."
    delete: false
    editor: { preview: false }
    files:
      - name: settings
        label: "Settings"
        file: "src/data/settings.json"
        fields:
          - { name: email, label: "Email address", widget: string, required: true, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', "Type a full email address"], hint: "Where customers reach you. Shown in the footer and on Contact." }
          - { name: ordersEmail, label: "Email for larger orders", widget: string, required: true, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', "Type a full email address"], hint: "Shown as \"for larger orders\" in the footer and on Contact." }
          - name: address
            label: "Address"
            widget: object
            fields:
              - { name: street, label: "Street", widget: string }
              - { name: city, label: "City", widget: string }
              - { name: state, label: "State", widget: string }
              - { name: zip, label: "ZIP code", widget: string }
          - name: hours
            label: "Opening hours"
            widget: list
            summary: "{{fields.days}}: {{fields.open}}{{fields.close}}"
            hint: "One row per group of days. For a closed day, put “Closed” in Opens and leave Closes empty."
            fields:
              - { name: days, label: "Days", widget: string, hint: "e.g. Tuesday – Sunday, or a single day like Monday" }
              - { name: open, label: "Opens", widget: string, hint: "e.g. 7:00 AM  (or “Closed”)" }
              - { name: close, label: "Closes", widget: string, required: false, hint: "e.g. 2:30 PM  (leave empty if closed)" }
          - name: links
            label: "Links"
            widget: object
            fields:
              - { name: instagram, label: "Instagram link", widget: string, hint: "Paste your Instagram profile link here." }
              - { name: instagramHandle, label: "Instagram handle", widget: string, hint: "Shown on the page, e.g. @loumabakery" }
              - { name: uberEats, label: "Uber Eats order link", widget: string, hint: "Saved for later. It isn't shown anywhere on the site right now." }


  # ====================================================== PAGE TEXT =========
  - name: copy
    label: "Page text"
    description: "The words on each page. Tip: edit the wording, but leave any “internal” fields as they are."
    delete: false
    editor: { preview: false }
    files:
      - name: copy
        label: "All pages"
        file: "src/data/copy.json"
        fields:
          # ---- Home ----
          - name: home
            label: "Home page"
            widget: object
            collapsed: true
            fields:
              - { name: tagline, label: "Tagline", widget: string, hint: "The line under the logo at the top of the page." }
              - { name: body, label: "Paragraphs", widget: list, field: { name: text, label: "Paragraph", widget: text }, hint: "The short introduction below the photo." }
              - { name: instagramTitle, label: "Instagram heading", widget: string, hint: "Above the row of Instagram photos, e.g. Follow along" }
              - { name: newsletterTitle, label: "Newsletter title", widget: string, hint: "Also shown in the footer." }
              - { name: newsletterBody, label: "Newsletter line", widget: string }
              - { name: newsletterCta, label: "Newsletter button", widget: string, hint: "Label on the home and phone bottom bar buttons, e.g. Get the newsletter" }
          # ---- Story page ----
          - name: story
            label: "Our Story page"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Headline", widget: string, hint: "The letter and sections are under “Our Story” in the left menu." }
          # ---- Initiative page ----
          - name: initiative
            label: "The Louma Initiative page"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Headline", widget: string }
              - { name: intro, label: "Introduction", widget: list, field: { name: text, label: "Paragraph", widget: text }, hint: "The opening paragraphs." }
              - name: sections
                label: "Sections"
                label_singular: "Section"
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: "Section title", widget: string }
                  - { name: paragraphs, label: "Paragraphs", widget: list, field: { name: text, label: "Paragraph", widget: text } }
              - { name: pillars, label: "The four pillars", widget: list, field: { name: text, label: "Pillar", widget: string }, hint: "One short name each, e.g. Employment" }
          # ---- Menu page ----
          - name: menu
            label: "Menu page"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Headline", widget: string }
              - { name: intro, label: "Introduction", widget: list, field: { name: text, label: "Paragraph", widget: text }, hint: "The paragraphs above the menu." }
              - { name: allergenNote, label: "Allergen note", widget: text }
          # ---- Shop page ----
          - name: shop
            label: "Shop page"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Headline", widget: string }
              - { name: status, label: "“Not open yet” text", widget: string, hint: "Shown under the headline and on any button that has no link yet, e.g. Coming soon" }
              - name: preorder
                label: "Pre-orders"
                widget: object
                fields:
                  - { name: title, label: "Heading", widget: string }
                  - { name: body, label: "Text", widget: text, required: false }
              - name: giftCards
                label: "Gift cards"
                widget: object
                fields:
                  - { name: title, label: "Heading", widget: string }
                  - { name: body, label: "Text", widget: text, required: false }
              - name: merch
                label: "Merch"
                widget: object
                fields:
                  - { name: title, label: "Heading", widget: string, hint: "The products themselves are under “Shop” in the left menu." }
          # ---- Visit page ----
          - name: visit
            label: "Contact page"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Headline", widget: string, hint: "Hours, address and emails are under “Site settings”." }
          # ---- Catering page ----
          - name: catering
            label: "Catering page"
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: "Eyebrow", widget: string }
              - { name: title, label: "Headline", widget: string }
              - { name: lede, label: "Intro line", widget: text }
              - { name: body, label: "Paragraphs", widget: list, field: { name: text, label: "Paragraph", widget: text } }
              - name: steps
                label: "Process steps"
                widget: list
                summary: "{{fields.n}} {{fields.title}}"
                fields:
                  - { name: n, label: "Number label", widget: string, hint: "e.g. 01" }
                  - { name: title, label: "Step title", widget: string }
                  - { name: body, label: "Step text", widget: text }
              - name: tiers
                label: "Options / tiers"
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: "Name", widget: string }
                  - { name: price, label: "Price", widget: string }
                  - { name: items, label: "Bullet points", widget: list, hint: "Type one and press Enter." }
                  - { name: note, label: "Small badge", widget: string, required: false }
          # ---- Careers page ----
          - name: careers
            label: "Careers page"
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: "Eyebrow", widget: string }
              - { name: title, label: "Headline", widget: string }
              - { name: lede, label: "Intro line", widget: text }
              - { name: body, label: "Paragraphs", widget: list, field: { name: text, label: "Paragraph", widget: text } }
              - name: roles
                label: "Open roles"
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: "Role title", widget: string }
                  - { name: type, label: "Type", widget: string, required: false, hint: "e.g. Full-time" }
                  - { name: body, label: "Description", widget: text }
          # ---- 404 page ----
          - name: notFound
            label: "“Page not found” page"
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: "Eyebrow", widget: string }
              - { name: title, label: "Headline", widget: string }
              - { name: lede, label: "Intro line", widget: text }
              - name: cta
                label: "Button"
                widget: object
                fields:
                  - { name: label, label: "Button text", widget: string }
                  - { name: href, label: "Link", widget: string }

  # ====================================================== OUR STORY =========
  - name: story
    label: "Our Story"
    description: "The letter and the sections on the Our Story page."
    delete: false
    editor: { preview: false }
    files:
      - name: story
        label: "Our Story"
        file: "src/data/story.json"
        fields:
          - name: letter
            label: "The letter"
            widget: object
            fields:
              - { name: paragraphs, label: "Paragraphs", widget: list, field: { name: text, label: "Paragraph", widget: text } }
              - { name: signature, label: "Signed", widget: string, hint: "The name at the end of the letter, e.g. Milla" }
          - name: sections
            label: "Sections"
            label_singular: "Section"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: "Section title", widget: string }
              - { name: paragraphs, label: "Paragraphs", widget: list, field: { name: text, label: "Paragraph", widget: text } }

  # =========================================================== SHOP =========
  - name: shop
    label: "Shop"
    description: "Links for pre-orders and gift cards, and the merch you sell."
    delete: false
    editor: { preview: false }
    files:
      - name: shop
        label: "Shop"
        file: "src/data/shop.json"
        fields:
          - { name: preorderLink, label: "Pre-order link", widget: string, required: false, hint: "Leave empty and the button says “Coming soon”." }
          - { name: giftCardLink, label: "Gift card link", widget: string, required: false, hint: "Leave empty and the button says “Coming soon”." }
          - name: products
            label: "Merch"
            label_singular: "Product"
            widget: list
            summary: "{{fields.name}} · {{fields.price}}"
            fields:
              - { name: name, label: "Name", widget: string, hint: "e.g. Louma Hat" }
              - { name: price, label: "Price", widget: string, required: false, hint: "e.g. $32" }
              - { name: description, label: "Description", widget: text, required: false, hint: "One short line." }
              - { name: size, label: "Size", widget: string, required: false, hint: "e.g. One size" }
              - { name: image, label: "Photo", widget: image, required: false, choose_url: false, hint: "Square works best. At least 800px wide, under 3MB." }
              - { name: alt, label: "Photo description", widget: string, required: false, hint: "What the photo shows, for screen readers." }
              - { name: link, label: "Buy link", widget: string, required: false, hint: "Leave empty and the button says “Coming soon”." }

  # ================================================ INSTAGRAM STRIP =========
  - name: instagram
    label: "Instagram strip"
    description: "The row of photos on the home page. Each one links to your Instagram."
    delete: false
    editor: { preview: false }
    files:
      - name: instagram
        label: "Instagram strip"
        file: "src/data/instagram.json"
        fields:
          - name: items
            label: "Photos"
            label_singular: "Photo"
            widget: list
            max: 6
            summary: "{{fields.alt}}"
            hint: "Up to six. A tile with no photo is skipped."
            fields:
              - { name: image, label: "Photo", widget: image, required: false, choose_url: false, hint: "Square works best. At least 600px wide, under 3MB." }
              - { name: alt, label: "Photo description", widget: string, required: false, hint: "What the photo shows, for screen readers." }
